<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<div layout:fragment="content" class="container-fluid py-4">
    <div class="row">
        <div class="col-md-11 mx-auto">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Cluster List</h2>
            </div>
            <div class="card shadow-sm">
                <div class="card-body px-0 pt-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>No.</th>
                                    <th>Age</th>
                                    <th>Gender</th>
<!--                                    <th>Location</th>-->
<!--                                    <th>Income</th>-->
                                    <th>Login</th>
                                    <th>Purchase</th>
                                    <th>Order</th>
                                    <th>Spending</th>
<!--                                    <th>Time</th>-->
<!--                                    <th>Pages</th>-->
                                    <th>Newsletter</th>
                                    <th>Interest</th>
                                    <th>Category</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="stat, iterStat : ${clusterStats}">
                                    <td th:text="${iterStat.count}"></td>
                                    <td th:text="${#numbers.formatDecimal(stat.avgAge, 1, 1)}"></td>
                                    <td th:text="${stat.dominantGender}"></td>
<!--                                    <td th:text="${stat.dominantLocation}"></td>-->
<!--                                    <td th:text="${#numbers.formatCurrency(stat.avgIncome)}"></td>-->
                                    <td th:text="${#numbers.formatDecimal(stat.avgLastLoginDays, 1, 1)}"></td>
                                    <td th:text="${#numbers.formatDecimal(stat.avgPurchaseFreq, 1, 1)}"></td>
                                    <td th:text="${'$' + #numbers.formatDecimal(stat.avgOrderValue, 1, 0)}"></td>
                                    <td th:text="${'$' + #numbers.formatDecimal(stat.avgTotalSpending, 1, 0)}"></td>
<!--                                    <td th:text="${#numbers.formatDecimal(stat.avgTimeSpent, 1, 1)}"></td>-->
<!--                                    <td th:text="${#numbers.formatDecimal(stat.avgPagesViewed, 1, 1)}"></td>-->
                                    <td th:text="${#numbers.formatPercent(stat.newsletterRatio, 1, 1)}"></td>
                                    <td th:text="${stat.dominantInterest}"></td>
                                    <td th:text="${stat.dominantCategory}"></td>
                                    <td>
                                        <a th:href="@{/clusters/{id}/members(id=${stat.clusterNumber})}" 
                                           class="btn btn-sm btn-outline-dark">
                                            View
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .table th, .table td {
        white-space: nowrap;
        padding: 0.5rem;
        font-size: 0.9rem;
        text-align: center;
        vertical-align: middle;
    }
    
    .table th {
        font-weight: 500;
    }
    
    .table-responsive {
        margin: 0;
    }
    
    .btn-sm {
        padding: 0.2rem 0.5rem;
        font-size: 0.8rem;
    }

    .card {
        border: none;
    }
</style>
</html>
